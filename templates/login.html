{% extends "auth_base.html" %}
{% block title %}Log in · AI Interview Coach{% endblock %}
{% block form %}
  <h1>Welcome back 👋</h1>
  <p class="sub">Log in to continue practising.</p>
  {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required autofocus value="{{ form.email or '' }}" placeholder="you@example.com">
    <div class="row-between"><label for="password">Password</label><a href="/forgot-password">Forgot password?</a></div>
    <div class="pw-wrap"><input id="password" name="password" type="password" autocomplete="current-password" required><button type="button">Show</button></div>
    <button class="btn" type="submit" style="width:100%;margin-top:24px">Log in</button>
  </form>
  <p class="alt">New here? <a href="/register">Create a free account</a></p>
{% endblock %}
