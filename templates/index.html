<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Interview Coach</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; text-align: center; margin-top: 100px; }
        h1 { color: #333; }
        select, button { padding: 10px 20px; margin-top: 20px; font-size: 18px; }
        button { background: #4CAF50; color: white; border: none; border-radius: 8px; cursor: pointer; }
        button:hover { background: #45a049; }
    </style>
</head>
<body>
    <h1>Welcome to AI Interview Coach</h1>
    <form method="POST">
        <label for="role">Select your role:</label><br>
        <select name="role" id="role" required>
            <option value="ml">Machine Learning</option>
            <option value="frontend">Frontend Developer</option>
            <option value="backend">Backend Developer</option>
            <option value="data_analyst">Data Analyst</option>
        </select>
        <br><br>
        <button type="submit">Start Interview</button>
    </form>
</body>
</html>
